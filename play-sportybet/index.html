<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Redirecting to SportyBet</title>

<style>:root{--bg:#070b14;--bg2:#0d1322;--text:#eef2fa;--muted:#a8b3c7;--red:#e30613;--green:#22c55e;--green2:#34d76d;--yellow:#ffc629}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(760px 420px at 50% 10%,rgba(34,197,94,.18),transparent 62%),radial-gradient(620px 420px at 50% 100%,rgba(227,6,19,.14),transparent 58%),linear-gradient(180deg,var(--bg2),var(--bg));display:grid;place-items:center;padding:24px;overflow:hidden}.redirect-card{width:min(100%,420px);padding:30px 24px 26px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(180deg,rgba(20,27,46,.96),rgba(10,15,28,.96));box-shadow:0 28px 70px rgba(0,0,0,.45)}.logo{width:142px;height:auto;margin:0 auto 22px;display:block}h1{font-size:1.55rem;line-height:1.18;margin-bottom:10px}p{color:var(--muted);font-size:.98rem;line-height:1.55;margin-bottom:22px}.loader{width:72px;height:72px;border-radius:50%;margin:0 auto 22px;position:relative;background:conic-gradient(from 0deg,var(--red),var(--yellow),var(--green2),var(--red));animation:spin .9s linear infinite}.loader:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#111827}.progress{height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:4px 0 20px}.progress span{display:block;height:100%;width:100%;transform-origin:left;animation:bar 1.5s linear forwards;background:linear-gradient(90deg,var(--green),var(--green2))}.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-radius:10px;background:linear-gradient(180deg,var(--green2),#16a34a);color:#fff;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 16px 35px rgba(34,197,94,.28)}.small{display:block;margin-top:14px;color:#7f8aa3;font-size:.82rem}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(max-width:480px){.redirect-card{padding:26px 18px 22px;border-radius:18px}h1{font-size:1.35rem}}</style>
</head>
<body>

</main>
<script>setTimeout(function(){window.location.replace('https://www.time4bets504.com/');},1500);</script>
</body>
</html>
